# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.workers.max=8

# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include resources from the
# dependencies,library owners, if they don't rely on the library's public R class
# declaration, can ignore this property. For projects that support library dependencies
# without wrapping them, this property disables the default hiding of transitive R class.
android.nonTransitiveRClass=true

# Enable Jetifier for library compatibility
android.enableJetifier=true

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m

# Set JDK path for compilation (use Android Studio's bundled JDK)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Enable R8 code shrinking
android.enableR8=true

# Enable view binding
android.viewBindingEnabled=true

# IDE support and layout preview settings
android.enableStrictVersionMatchingOnLibraryPublications=true
android.useManifestParsingFallback=true
